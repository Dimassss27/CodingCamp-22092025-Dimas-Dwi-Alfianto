<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar -->
  <header>
    <div class="logo"><img src="asset/logo.png" alt="logo"></div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="profile.html">Our Profile</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#message">Message Us</a></li>
      </ul>
    </nav>
  </header>

  <!-- Welcome Section -->
  <section class="banner">
    <h1 id="welcome-text">Hi, Welcome To Website</h1>
    <p>Ini adalah website latihan pertama</p>

    <div class="slideshow-container">
    <div class="slide fade">
      <img src="asset/slide1.png" alt="Slide 1">
    </div>
    <div class="slide fade">
      <img src="asset/slide2.png" alt="Slide 2">
    </div>
    </div>
  </section>

  <!-- Headquarters Section -->
  <section class="headquarter">
    <h2>Our Headquarter</h2>
    <div class="locations">
      <div class="city">
        <div class="circle"></div>
        <p>Jakarta</p>
      </div>
      <div class="city">
        <div class="circle"></div>
        <p>Bandung</p>
      </div>
      <div class="city">
        <div class="circle"></div>
        <p>Surabaya</p>
      </div>
    </div>
  </section>

  <!-- Message Form -->
  <section id="message" class="message">
    <h2>Message Us</h2>
    <div class="form-container">
      <form id="messageForm">
        <label>Nama</label>
        <input type="text" id="name" required>
        
        <label>Tanggal Lahir</label>
        <input type="date" id="dob" required>
        
        <label>Jenis Kelamin</label>
        <div>
          <input type="radio" name="gender" value="Laki-Laki" required> Laki-Laki
          <input type="radio" name="gender" value="Perempuan"> Perempuan
        </div>
        
        <label>Pesan</label>
        <textarea id="messageText" required></textarea>
        
        <button type="submit">Submit</button>
      </form>

      <div class="output">
        <p><b>Current time :</b> <span id="current-time"></span></p>
        <p><b>Nama :</b> <span id="out-name"></span></p>
        <p><b>Tanggal Lahir :</b> <span id="out-dob"></span></p>
        <p><b>Jenis Kelamin :</b> <span id="out-gender"></span></p>
        <p><b>Pesan :</b> <span id="out-message"></span></p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>Created By Dimas Dwi Alfianto</p>
  </footer>

  <script src="js/index.js"></script>
</body>
</html>
